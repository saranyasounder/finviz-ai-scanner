# Conviction score = a weighted blend of momentum score, AI-analysis
# confidence, and news corroboration - used to rank stocks in the email
# report by likelihood of profit rather than raw momentum score alone.
# Tune these without touching code.
#
#   conviction_score = (momentum_score * weights.momentum)
#                     + (ai_confidence_score_0_100 * weights.ai_confidence)
#                     + news_verdict_modifier
#
# ai_confidence_score_0_100 is ClaudeAnalysis.confidence.score directly (the
# model now reports its own 0-100 confidence, so no category->number lookup
# is needed anymore). default_ai_confidence is used only when there's no
# analysis at all (stock.analysis is None - skipped by min_score_to_analyze,
# or the API call failed/was abandoned this cycle).
#
# news_verdict_modifier: if a stock has multiple headlines with different
# verdicts, the worst one wins (any CONFLICTING headline outweighs a
# CORROBORATED one) - one contradicting headline is a real risk signal.
# `no_news` applies when a stock has no news_validations at all.

weights:
  momentum: 0.4
  ai_confidence: 0.4

default_ai_confidence: 50

news_verdict_modifiers:
  corroborated: 10
  conflicting: -15
  inconclusive: 0
  no_news: 0

must_watch_top_n: 5
