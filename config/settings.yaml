browser:
  profile_dir: chrome_profile
  headless: false
  download_timeout_ms: 15000

market_hours:
  timezone: America/New_York
  start_hour: 9
  start_minute: 30
  end_hour: 16
  end_minute: 0
  days: mon-fri

snapshots:
  directory: data/snapshots
  retention_days: 30
  top_n: 10

change_detection:
  score_delta: 5.0
  relative_volume_delta: 0.5
  gap_delta_pct: 1.0
  price_delta_pct: 1.0

claude:
  # Routed through OpenRouter's OpenAI-compatible API, not Anthropic's native API.
  # Verify the exact slug at https://openrouter.ai/models if analysis calls 404.
  model: anthropic/claude-sonnet-5
  # Real completions for this schema run ~150-220 tokens (measured). 500 is a
  # ~2x safety margin, not a bare minimum - the old 1024 was ~5x oversized.
  # Doesn't change cost directly (output is billed by tokens actually
  # generated, not this cap) but OpenRouter's balance-affordability check
  # reserves against this number before generating, so a lower cap means
  # fewer spurious 402s at a low balance.
  max_tokens: 500
  base_url: https://openrouter.ai/api/v1
  site_url: https://github.com/saranyasounder/finviz-ai-scanner
  site_name: Finviz AI Scanner
  request_timeout_seconds: 30
  # Momentum-score floor below which a candidate skips the AI call entirely
  # (it still gets scored/enriched/reported - just no AI writeup). Tune this
  # once you have a few days of real score distributions in data/snapshots/;
  # 30 is a conservative starting point, not a measured optimum.
  min_score_to_analyze: 30

enrichment:
  fibonacci_lookback_days: 90
  news_max_headlines: 5
  prompt_headline_count: 3
  news_fetch_delay_seconds: 1.5

email:
  subject_prefix: "[Finviz AI Scanner]"
  smtp_timeout_seconds: 15

logging:
  directory: logs
  rotation: "00:00"
  retention: "14 days"
  level: INFO

retention:
  # Transient artifacts only (raw screener CSVs in downloads/) - never touches
  # data/snapshots/, the permanent historical store, which has its own
  # separate retention policy above (snapshots.retention_days).
  downloads_keep_days: 0

outcome_tracking:
  # Step 1 of the alerting tier: log every Must-Watch candidate as if it had
  # alerted, and check back in on it at these intervals to see whether the
  # scoring/AI-analysis is actually any good - before a single real alert
  # email is ever sent (that's Tier 1/2, built later).
  checkpoint_minutes: [30, 60, 240, 1440]
  conviction_bucket_high: 70
  conviction_bucket_medium: 40
