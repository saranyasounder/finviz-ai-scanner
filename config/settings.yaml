browser:
  profile_dir: chrome_profile
  headless: false
  download_timeout_ms: 15000

market_hours:
  timezone: America/Los_Angeles
  start_hour: 6
  end_hour: 13
  days: mon-fri

snapshots:
  directory: data/snapshots
  retention_days: 30
  top_n: 10

change_detection:
  score_delta: 5.0
  relative_volume_delta: 0.5
  gap_delta_pct: 1.0
  price_delta_pct: 1.0

claude:
  model: claude-sonnet-5
  max_tokens: 1024

email:
  subject_prefix: "[Finviz AI Scanner]"

logging:
  directory: logs
  rotation: "10 MB"
  retention: "14 days"
  level: INFO
