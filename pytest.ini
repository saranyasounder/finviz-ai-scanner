[pytest]
# Makes `models`, `config`, etc. importable when pytest is run from the
# project root, regardless of invocation style (`pytest`, `python -m pytest`,
# or from a subdirectory) - explicit and independent of the `-m` CWD-insertion
# quirk that happened to make `python -m pytest` work before this existed.
# A root conftest.py would also work (its containing directory gets added to
# sys.path as a side effect of pytest collecting it), but that's an implicit
# mechanism with no fixtures of its own to justify the file; pythonpath says
# directly what it does.
pythonpath = .

markers =
    integration: hits a real paid/external service (Claude/OpenRouter API, yfinance network calls, real Finviz browser automation) - costs money and/or requires network/credentials. Excluded by default; run explicitly with `pytest -m integration`.

# Plain `pytest` / `python -m pytest` runs only the free, mocked unit suite.
addopts = -m "not integration"
